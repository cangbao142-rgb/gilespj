<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日盘解 - 交易笔记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">交易<span>笔记</span></a>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="daily.html" class="active">每日盘解</a></li>
        <li><a href="chart.html">实时看盘</a></li>
        <li><a href="about.html">关于我</a></li>
      </ul>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1>每日盘解</h1>
        <p>每日市场分析与操作记录</p>
      </div>

      <!-- 切换 -->
      <div class="category-tabs">
        <span class="tab active" data-type="daily">盘解</span>
        <span class="tab" data-type="operation">操作记录</span>
      </div>

      <!-- 列表 -->
      <div id="dailyList">
        <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
      </div>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© 2026 交易笔记 - 记录每一笔交易</p>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@1"></script>
  <script src="js/config.js"></script>
  <script src="js/articles.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let currentPage = 1;
    let currentType = 'daily';

    async function loadDaily(page = 1) {
      const container = document.getElementById('dailyList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';

      try {
        const { data, total } = await Articles.getList({
          category: currentType,
          page,
          pageSize: 15
        });

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📈</div><p>暂无内容</p></div>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        container.innerHTML = data.map(post => `
          <a href="article.html?id=${post.id}" class="daily-item" style="text-decoration:none;color:inherit;">
            <div class="date">${Articles.formatDate(post.created_at)}</div>
            <h3>${post.title}</h3>
            <div class="summary">${Articles.getExcerpt(post.content, 150)}</div>
          </a>
        `).join('');

        currentPage = page;
        Utils.renderPagination(document.getElementById('pagination'), {
          total,
          page,
          pageSize: 15,
          onChange: loadDaily
        });
      } catch (err) {
        container.innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
        console.error(err);
      }
    }

    // 切换盘解/操作记录
    document.querySelectorAll('.category-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.category-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        loadDaily(1);
      });
    });

    Utils.initNav();
    loadDaily();
  </script>
</body>
</html>
