<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理登录 - 交易笔记</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h2>📝 管理后台</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">登录</button>
        <p id="errorMsg" style="color:red;text-align:center;margin-top:12px;font-size:14px;display:none;"></p>
      </form>
      <div style="text-align:center;margin-top:20px;">
        <a href="../index.html" style="font-size:13px;color:#999;">← 返回首页</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // 如果已登录，直接跳转
    Auth.isLoggedIn().then(loggedIn => {
      if (loggedIn) window.location.href = 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');

      try {
        errorEl.style.display = 'none';
        await Auth.signIn(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = '登录失败: ' + (err.message || '请检查邮箱和密码');
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
