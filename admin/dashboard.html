<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - Giles博客</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <!-- 侧边栏 -->
    <aside class="admin-sidebar">
      <div class="brand">Giles博客</div>
      <a href="dashboard.html" class="nav-item active">📊 仪表盘</a>
      <a href="post.html" class="nav-item">✏️ 发布文章</a>
      <a href="post.html?category=daily" class="nav-item">📈 发布盘解</a>
      <a href="post.html?category=operation" class="nav-item">📋 发布操作记录</a>
      <a href="../index.html" class="nav-item" target="_blank">🌐 查看网站</a>
      <a href="#" class="nav-item" id="logoutBtn">🚪 退出登录</a>
    </aside>

    <!-- 主内容 -->
    <main class="admin-main">
      <div class="admin-header">
        <h2>仪表盘</h2>
        <span id="userEmail" style="color:#999;font-size:14px;"></span>
      </div>

      <!-- 统计 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="number" id="statArticles">0</div>
          <div class="label">文章</div>
        </div>
        <div class="stat-card">
          <div class="number" id="statDaily">0</div>
          <div class="label">盘解</div>
        </div>
        <div class="stat-card">
          <div class="number" id="statOperations">0</div>
          <div class="label">操作记录</div>
        </div>
      </div>

      <!-- 最近内容 -->
      <h3 style="margin-bottom:16px;">最近发布</h3>
      <div class="data-table">
        <table>
          <thead>
            <tr>
              <th>标题</th>
              <th>分类</th>
              <th>发布时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recentPosts">
            <tr><td colspan="4" style="text-align:center;color:#999;">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@1"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/articles.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const categoryMap = { article: '文章', daily: '盘解', operation: '操作记录' };

    async function init() {
      const ok = await Auth.requireAuth();
      if (!ok) return;

      const user = await Auth.getUser();
      document.getElementById('userEmail').textContent = user?.email || '';

      // 加载统计
      try {
        const stats = await Articles.getStats();
        document.getElementById('statArticles').textContent = stats.articles;
        document.getElementById('statDaily').textContent = stats.daily;
        document.getElementById('statOperations').textContent = stats.operations;
      } catch (err) {
        console.error('统计加载失败:', err);
      }

      // 加载最近内容
      try {
        const { data } = await Articles.getList({ pageSize: 10 });
        const tbody = document.getElementById('recentPosts');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;">暂无内容</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(post => `
          <tr>
            <td><a href="post.html?id=${post.id}">${post.title}</a></td>
            <td><span class="tag">${categoryMap[post.category] || post.category}</span></td>
            <td>${Articles.formatDate(post.created_at)}</td>
            <td class="actions">
              <a href="post.html?id=${post.id}" class="btn btn-outline btn-sm">编辑</a>
              <button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">删除</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('列表加载失败:', err);
      }
    }

    async function deletePost(id) {
      if (!Utils.confirm('确定要删除这篇内容吗？')) return;
      try {
        await Articles.delete(id);
        Utils.toast('删除成功');
        init();
      } catch (err) {
        Utils.toast('删除失败: ' + err.message, 'error');
      }
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await Auth.signOut();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
